upstream app_example_backend {
    server 127.0.0.1:8000 fail_timeout=0;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name cris.pibico.es;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cris.pibico.es;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/cris.pibico.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cris.pibico.es/privkey.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50M;

    # Logs
    access_log /var/log/nginx/app_example_access.log;
    error_log /var/log/nginx/app_example_error.log;

    # ==========================================
    # Security headers
    # ==========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP relaxed for Three.js inline scripts
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self';" always;

    # ==========================================
    # Gzip compression
    # ==========================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ==========================================
    # Static files with tiered caching
    # ==========================================
    location /static/ {
        alias /home/erpnext/.services/app_example/app/static/;

        # Default: images and misc assets
        expires 30d;
        add_header Cache-Control "public, immutable";

        # Fonts: long cache (rarely change)
        location ~* \.(woff2|woff|ttf|eot)$ {
            expires 365d;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
        }

        # CSS and JS: moderate cache (may change on deploys)
        location ~* \.(css|js)$ {
            expires 7d;
            add_header Cache-Control "public, must-revalidate";
        }
    }

    # ==========================================
    # app_markets: SSE streaming chat
    # ==========================================
    # SSE: disable buffering for streaming chat
    location /market/api/v1/chat/ {
        proxy_pass http://app_markets_backend/api/v1/chat/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /market;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /market/ {
        proxy_pass http://app_markets_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /market;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_redirect off;
    }

    # ==========================================
    # Proxy to Gunicorn/Uvicorn backend
    # ==========================================
    location / {
        proxy_pass http://app_example_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_redirect off;
    }
}
